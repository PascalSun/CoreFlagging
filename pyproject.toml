[project]
name = "coretrace"
version = "0.1.0"
description = "CoreTrace: reads HyLogger core scans and runs the core-spectra models for the Geo Research Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Versions are the ones the model bundle was built and verified with. bundle/models/*/heads.pkl
# holds scikit-learn objects: keep scikit-learn at this version.
dependencies = [
    "torch==2.6.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "pillow==11.3.0",
    "pytsg==0.5.0",
    "fastapi>=0.136.1",
    "pydantic>=2.13.3",
    "uvicorn[standard]>=0.46.0",
    "httpx>=0.28.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["parity: needs the nine demo holes as TSG files and the demo's processed arrays (CORETRACE_PARITY_TSG, CORETRACE_PARITY_SEED)"]
