# CoreTrace next to the platform (Groundwork): its own stack, meeting the platform on the
# shared external network `geo_shared` (docker network create geo_shared).
# On the platform side set CORETRACE_SERVICE_URL=http://coretrace:8000.
name: coretrace
services:
  coretrace:
    build: { context: ., target: prod }
    image: coretrace
    container_name: geo-coretrace
    env_file: .env
    environment:
      CORETRACE_WORK: /work
      CORETRACE_NVCL_ROOT: /nvcl/NVCL/tsg
      CORETRACE_CATALOGUE: /nvcl/_catalog/all_datasets.json
      CORETRACE_NVCL_STORE: /nvclstore
      # the Similar-core library, one row per metre of every WA hole, built by `app.cli build-library` and copied
      # into the work volume; until the file is there the engine falls back to the library bundled with the model
      CORETRACE_LIBRARY: /work/library_1m_v2.npz
    volumes:
      - coretrace_work:/work
      - ${NVCL_MIRROR:-/mnt/qnap/WAGeoData/WAGeoDataPublic/geossdi.dmp.wa.gov.au}:/nvcl:ro
      - ${NVCL_STORE:-/mnt/qnap/WAGeoData/WAGeoDataPublic/nvclstore.data.auscope.org.au}:/nvclstore:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      geo_shared: {}
  # CoreTrace's own frontend (coretrace.nlp-tlp.org). NEXT_PUBLIC_* are inlined at build time → build args.
  # Talks to the platform only through its public API; the browser signs in through the platform (OAuth).
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_PLATFORM_URL: ${NEXT_PUBLIC_PLATFORM_URL:-https://platform.nlp-tlp.org}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_PLATFORM_URL:-https://platform.nlp-tlp.org}
        NEXT_PUBLIC_PLATFORM_CLIENT_ID: ${NEXT_PUBLIC_PLATFORM_CLIENT_ID:-coretrace-web}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_BUILD_ID: ${NEXT_PUBLIC_BUILD_ID:-manual}
    image: coretrace-web
    container_name: geo-coretrace-web
    env_file: .env                   # OPENROUTER_API_KEY, PLATFORM_API_TOKEN, PLATFORM_API_URL for the assistant's route
    environment:
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform:8000}
    ports:
      - "3003:3000"
    restart: unless-stopped
    networks:
      geo_shared: {}
volumes:
  coretrace_work: {}
networks:
  geo_shared:
    external: true
