name: ci
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3" }
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bunx eslint src packages
      - run: bun run build
        env: { NEXT_PUBLIC_PLATFORM_URL: https://platform.nlp-tlp.org, NEXT_PUBLIC_BUILD_ID: ci }
